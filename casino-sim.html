<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Strategy Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;       /* Deep Navy */
            --card-bg: #1e293b;        /* Lighter Navy */
            --primary: #8b5cf6;        /* Strategy Purple */
            --accent: #10b981;         /* Green */
            --danger: #ef4444;         /* Red */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .control-group { display: flex; flex-direction: column; }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, select {
            background: #1e293b;
            color: white;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        /* Highlight the Strategy Dropdown */
        #strategy {
            border-color: var(--primary);
            color: #c4b5fd;
        }

        button {
            grid-column: 1 / -1;
            padding: 16px;
            background: linear-gradient(to right, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }

        button:hover { transform: translateY(-1px); }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-box { text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }

        .chart-container {
            position: relative;
            height: 500px;
            width: 100%;
            background: #0f172a;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Strategy Simulator</h1>

    <div class="controls">
        <div class="control-group">
            <label>Start Bankroll ($)</label>
            <input type="number" id="bankroll" value="2000">
        </div>
        <div class="control-group">
            <label>Base Bet ($)</label>
            <input type="number" id="betSize" value="25">
        </div>
        <div class="control-group">
            <label style="color: #a78bfa;">Betting Strategy</label>
            <select id="strategy">
                <option value="flat">Flat Betting (Safe)</option>
                <option value="martingale">Martingale (Risky)</option>
                <option value="paroli">Paroli (Hot Streak)</option>
                <option value="dalembert">D'Alembert (Grinder)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Hands to Play</label>
            <input type="number" id="hands" value="1000">
        </div>
        <div class="control-group">
            <label>Simulations</label>
            <input type="number" id="sims" value="50" max="100">
        </div>
        <div class="control-group">
            <label>Rules</label>
            <select id="rules">
                <option value="standard">3:2 (Standard)</option>
                <option value="bad">6:5 (Carnival)</option>
            </select>
        </div>
        <button onclick="runSimulation()">Run Simulation</button>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-val" id="stat-ror">0%</span>
            <span class="stat-label">Risk of Ruin</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-avg">$0</span>
            <span class="stat-label">Avg Result</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-survived">0/0</span>
            <span class="stat-label">Survivors</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<script>
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

    let myChart = null;

    // --- MATH ENGINE ---
    function playHandPro(currentBankroll, betSize, is6to5) {
        const bjPayout = is6to5 ? 1.2 : 1.5;
        const outcomes = [
            { type: 'BJ',       weight: 0.048, val: bjPayout },
            { type: 'Win',      weight: 0.358, val: 1.0 },
            { type: 'DblWin',   weight: 0.040, val: 2.0 },
            { type: 'Push',     weight: 0.085, val: 0.0 },
            { type: 'Loss',     weight: 0.427, val: -1.0 },
            { type: 'DblLoss',  weight: 0.042, val: -2.0 }
        ];

        const rand = Math.random();
        let cumulative = 0;
        for (let outcome of outcomes) {
            cumulative += outcome.weight;
            if (rand < cumulative) {
                return currentBankroll + (betSize * outcome.val);
            }
        }
        return currentBankroll - betSize; 
    }

    // --- SIMULATION LOOP ---
    function runSimulation() {
        const startBankroll = parseFloat(document.getElementById('bankroll').value);
        const baseBet = parseFloat(document.getElementById('betSize').value);
        const strategy = document.getElementById('strategy').value;
        const totalHands = parseInt(document.getElementById('hands').value);
        const simCount = parseInt(document.getElementById('sims').value);
        const is6to5 = document.getElementById('rules').value === 'bad';

        const allDatasets = [];
        let ruinedCount = 0;
        let finalBankrollSum = 0;
        const labels = Array.from({length: totalHands + 1}, (_, i) => i);

        for (let i = 0; i < simCount; i++) {
            let bankroll = startBankroll;
            const dataPoints = [bankroll];
            let isRuined = false;

            // Strategy State Variables
            let currentBet = baseBet;
            let consecutiveWins = 0;
            
            for (let h = 0; h < totalHands; h++) {
                if (bankroll < 5) { // Broke
                    bankroll = 0;
                    isRuined = true;
                } else {
                    // Cap bet at current bankroll (Can't bet what you don't have)
                    if (currentBet > bankroll) currentBet = bankroll;

                    let newBankroll = playHandPro(bankroll, currentBet, is6to5);
                    let profit = newBankroll - bankroll;
                    
                    // --- STRATEGY LOGIC UPDATE ---
                    if (strategy === 'martingale') {
                        if (profit < 0) {
                            currentBet *= 2; // Double on loss
                        } else if (profit > 0) {
                            currentBet = baseBet; // Reset on win
                        }
                        // Note: Push keeps same bet
                    } 
                    else if (strategy === 'paroli') {
                        if (profit > 0) {
                            consecutiveWins++;
                            if (consecutiveWins < 3) currentBet *= 2; // Double up to 3 times
                            else {
                                currentBet = baseBet; // Reset after 3rd win
                                consecutiveWins = 0;
                            }
                        } else if (profit < 0) {
                            currentBet = baseBet; // Reset on loss
                            consecutiveWins = 0;
                        }
                    } 
                    else if (strategy === 'dalembert') {
                        if (profit < 0) {
                            currentBet += baseBet; // Increase by 1 unit
                        } else if (profit > 0) {
                            if (currentBet > baseBet) currentBet -= baseBet; // Decrease by 1 unit
                        }
                    }
                    else {
                        // Flat betting (Always base bet)
                        currentBet = baseBet;
                    }
                    
                    bankroll = newBankroll;
                }
                dataPoints.push(bankroll);
            }

            finalBankrollSum += bankroll;
            if (isRuined) ruinedCount++;

            // DYNAMIC COLORING
            let color = 'rgba(255, 255, 255, 0.1)'; // Default Faint
            if (isRuined) color = 'rgba(239, 68, 68, 0.6)'; // Red
            else if (bankroll > startBankroll) color = 'rgba(16, 185, 129, 0.6)'; // Green
            
            // Highlight massive winners (Strategy success)
            if (bankroll > startBankroll * 2) color = '#fbbf24'; // Gold for doubling money

            allDatasets.push({
                label: `Sim ${i+1}`,
                data: dataPoints,
                borderColor: color,
                borderWidth: 1,
                pointRadius: 0, 
                fill: false,
                tension: 0.1 
            });
        }

        const ror = ((ruinedCount / simCount) * 100).toFixed(1);
        const avg = (finalBankrollSum / simCount).toFixed(2);
        
        const rorEl = document.getElementById('stat-ror');
        rorEl.innerText = `${ror}%`;
        rorEl.style.color = ror > 20 ? '#ef4444' : '#10b981';
        
        document.getElementById('stat-avg').innerText = `$${avg}`;
        document.getElementById('stat-survived').innerText = `${simCount - ruinedCount}/${simCount}`;

        renderChart(labels, allDatasets, startBankroll);
    }

    function renderChart(labels, datasets, startLine) {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        if (myChart) myChart.destroy();

        datasets.push({
            label: 'Start Bankroll',
            data: new Array(labels.length).fill(startLine),
            borderColor: '#fbbf24',
            borderWidth: 2,
            borderDash: [5, 5],
            pointRadius: 0,
            order: 0 
        });

        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false, 
                animation: false, 
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: {
                    x: { display: true, ticks: { maxTicksLimit: 10 }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { display: true, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                elements: { line: { tension: 0 } }
            }
        });
    }

    runSimulation();
</script>

</body>
</html>
