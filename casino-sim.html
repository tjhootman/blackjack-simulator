<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Strategy Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;       /* Deep Navy */
            --card-bg: #1e293b;        /* Lighter Navy */
            --primary: #8b5cf6;        /* Strategy Purple */
            --accent: #10b981;         /* Green */
            --danger: #ef4444;         /* Red */
            --gold: #fbbf24;           /* Gold */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            padding: 25px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .control-group { display: flex; flex-direction: column; }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, select {
            background: #1e293b;
            color: white;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        #strategy {
            border-color: var(--primary);
            color: #c4b5fd;
            font-weight: 600;
        }

        .strategy-info {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--primary);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .strategy-info strong {
            display: block;
            color: #c4b5fd;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .strategy-info p {
            margin: 0;
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        button {
            grid-column: 1 / -1;
            padding: 16px;
            background: linear-gradient(to right, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }

        button:hover { transform: translateY(-1px); }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-box { text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }

        .chart-container {
            position: relative;
            height: 500px;
            width: 100%;
            background: #0f172a;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #334155;
        }

        .legend-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }

        .line-dash {
            width: 25px;
            height: 0;
            border-top: 2px dashed #fbbf24;
            margin-right: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Strategy Simulator</h1>

    <div class="controls">
        <div class="control-group">
            <label>Start Bankroll ($)</label>
            <input type="number" id="bankroll" value="2000" min="5">
        </div>
        <div class="control-group">
            <label>Base Bet ($)</label>
            <input type="number" id="betSize" value="25" min="1">
        </div>
        <div class="control-group">
            <label style="color: #a78bfa;">Betting Strategy</label>
            <select id="strategy" onchange="updateStrategyInfo()">
                <option value="flat">Flat Betting (Safe)</option>
                <option value="martingale">Martingale (Risky)</option>
                <option value="paroli">Paroli (Hot Streak)</option>
                <option value="dalembert">D'Alembert (Grinder)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Hands (Max 5000)</label>
            <input type="number" id="hands" value="1000" max="5000">
        </div>
        <div class="control-group">
            <label>Simulations (Max 100)</label>
            <input type="number" id="sims" value="50" max="100">
        </div>
        <div class="control-group">
            <label>Rules</label>
            <select id="rules">
                <option value="standard">3:2 (Standard)</option>
                <option value="bad">6:5 (Carnival)</option>
            </select>
        </div>
        <button onclick="runSimulation()">Run Simulation</button>
    </div>

    <div class="strategy-info" id="strategyInfo">
        <strong>Flat Betting</strong>
        <p>Bet the same amount every hand. This minimizes volatility and is the standard way to play.</p>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-val" id="stat-ror">0%</span>
            <span class="stat-label">Risk of Ruin</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-avg">$0</span>
            <span class="stat-label">Avg Result</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-survived">0/0</span>
            <span class="stat-label">Survivors</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="legend-bar">
        <div class="legend-item">
            <span class="dot" style="background-color: #fbbf24;"></span> Big Winner (2x)
        </div>
        <div class="legend-item">
            <span class="dot" style="background-color: #10b981;"></span> Profitable
        </div>
        <div class="legend-item">
            <span class="dot" style="background-color: rgba(255,255,255,0.2);"></span> Survivor (Loss)
        </div>
        <div class="legend-item">
            <span class="dot" style="background-color: #ef4444;"></span> Ruined ($0)
        </div>
        <div class="legend-item">
            <span class="line-dash"></span> Start Amount
        </div>
    </div>
</div>

<script>
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

    let myChart = null;

    const strategyDescriptions = {
        flat: {
            title: "Flat Betting (Standard)",
            text: "You bet the same amount every hand. This is the safest way to play and minimizes volatility. It usually yields the longest play time."
        },
        martingale: {
            title: "Martingale (The 'Widowmaker')",
            text: "Double your bet after every loss. Reset to base bet after a win. Risks HUGE losses to chase small wins. Watch the red lines crash!"
        },
        paroli: {
            title: "Paroli (The 'Anti-Martingale')",
            text: "Double your bet after a win (up to 3 times). Reset on loss. This capitalizes on 'hot streaks' without risking your own bankroll aggressively."
        },
        dalembert: {
            title: "D'Alembert (The Grinder)",
            text: "Increase bet by 1 unit after a loss. Decrease by 1 unit after a win. A balanced system that is safer than Martingale but more aggressive than Flat betting."
        }
    };

    function updateStrategyInfo() {
        const val = document.getElementById('strategy').value;
        const info = strategyDescriptions[val];
        const box = document.getElementById('strategyInfo');
        box.innerHTML = `<strong>${info.title}</strong><p>${info.text}</p>`;
        box.style.borderColor = '#c4b5fd';
        setTimeout(() => box.style.borderColor = '#8b5cf6', 300);
    }

    // --- MATH ENGINE ---
    function playHandPro(currentBankroll, betSize, is6to5) {
        const bjPayout = is6to5 ? 1.2 : 1.5;
        const outcomes = [
            { type: 'BJ',       weight: 0.048, val: bjPayout },
            { type: 'Win',      weight: 0.358, val: 1.0 },
            { type: 'DblWin',   weight: 0.040, val: 2.0 },
            { type: 'Push',     weight: 0.085, val: 0.0 },
            { type: 'Loss',     weight: 0.427, val: -1.0 },
            { type: 'DblLoss',  weight: 0.042, val: -2.0 }
        ];

        const rand = Math.random();
        let cumulative = 0;
        for (let outcome of outcomes) {
            cumulative += outcome.weight;
            if (rand < cumulative) {
                return currentBankroll + (betSize * outcome.val);
            }
        }
        return currentBankroll - betSize; 
    }

    // --- SIMULATION LOOP ---
    function runSimulation() {
        // --- 1. GET & CLAMP INPUTS ---
        let startBankroll = parseFloat(document.getElementById('bankroll').value);
        let baseBet = parseFloat(document.getElementById('betSize').value);
        let totalHands = parseInt(document.getElementById('hands').value);
        let simCount = parseInt(document.getElementById('sims').value);
        const strategy = document.getElementById('strategy').value;
        const is6to5 = document.getElementById('rules').value === 'bad';

        // CLAMP: Simulations (1 to 100)
        if (simCount > 100) { simCount = 100; document.getElementById('sims').value = 100; }
        if (simCount < 1) simCount = 1;

        // CLAMP: Hands (10 to 5000)
        if (totalHands > 5000) { totalHands = 5000; document.getElementById('hands').value = 5000; }
        if (totalHands < 10) totalHands = 10;

        // CLAMP: Bankroll (Min $5)
        if (startBankroll < 5) {
            startBankroll = 5;
            document.getElementById('bankroll').value = 5;
        }

        // CLAMP: Bet (Max = Bankroll, Min = 1)
        if (baseBet < 1) {
            baseBet = 1;
            document.getElementById('betSize').value = 1;
        }
        if (baseBet > startBankroll) {
            baseBet = startBankroll; // Force bet down to match cash
            document.getElementById('betSize').value = startBankroll;
        }

        const allDatasets = [];
        let ruinedCount = 0;
        let finalBankrollSum = 0;
        const labels = Array.from({length: totalHands + 1}, (_, i) => i);

        for (let i = 0; i < simCount; i++) {
            let bankroll = startBankroll;
            const dataPoints = [bankroll];
            let isRuined = false;

            let currentBet = baseBet;
            let consecutiveWins = 0;
            
            for (let h = 0; h < totalHands; h++) {
                // CHANGED: Ruin is now < 1 (effectively 0), so $5 bankrolls can play
                if (bankroll < 1) { 
                    bankroll = 0;
                    isRuined = true;
                } else {
                    // Logic check: Can't bet more than you have
                    if (currentBet > bankroll) currentBet = bankroll;

                    let newBankroll = playHandPro(bankroll, currentBet, is6to5);
                    let profit = newBankroll - bankroll;
                    
                    if (strategy === 'martingale') {
                        if (profit < 0) currentBet *= 2;
                        else if (profit > 0) currentBet = baseBet;
                    } 
                    else if (strategy === 'paroli') {
                        if (profit > 0) {
                            consecutiveWins++;
                            if (consecutiveWins < 3) currentBet *= 2;
                            else { currentBet = baseBet; consecutiveWins = 0; }
                        } else if (profit < 0) {
                            currentBet = baseBet; consecutiveWins = 0;
                        }
                    } 
                    else if (strategy === 'dalembert') {
                        if (profit < 0) currentBet += baseBet;
                        else if (profit > 0 && currentBet > baseBet) currentBet -= baseBet;
                    }
                    else {
                        currentBet = baseBet;
                    }
                    
                    bankroll = newBankroll;
                }
                dataPoints.push(bankroll);
            }

            finalBankrollSum += bankroll;
            if (isRuined) ruinedCount++;

            let color = 'rgba(255, 255, 255, 0.1)'; 
            let order = 1;

            if (isRuined) {
                color = 'rgba(239, 68, 68, 0.5)'; 
                order = 2; 
            }
            else if (bankroll > startBankroll * 2) {
                color = '#fbbf24'; 
                order = 4; 
            }
            else if (bankroll > startBankroll) {
                color = 'rgba(16, 185, 129, 0.5)'; 
                order = 3; 
            }

            allDatasets.push({
                label: `Sim ${i+1}`,
                data: dataPoints,
                borderColor: color,
                borderWidth: (order === 4) ? 2 : 1, 
                pointRadius: 0, 
                fill: false,
                tension: 0.1,
                order: 100 - order 
            });
        }

        const ror = ((ruinedCount / simCount) * 100).toFixed(1);
        const avg = (finalBankrollSum / simCount).toFixed(2);
        
        const rorEl = document.getElementById('stat-ror');
        rorEl.innerText = `${ror}%`;
        rorEl.style.color = ror > 20 ? '#ef4444' : '#10b981';
        
        document.getElementById('stat-avg').innerText = `$${avg}`;
        document.getElementById('stat-survived').innerText = `${simCount - ruinedCount}/${simCount}`;

        renderChart(labels, allDatasets, startBankroll);
    }

    function renderChart(labels, datasets, startLine) {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        if (myChart) myChart.destroy();

        datasets.push({
            label: 'Start Bankroll',
            data: new Array(labels.length).fill(startLine),
            borderColor: '#fbbf24',
            borderWidth: 2,
            borderDash: [5, 5],
            pointRadius: 0,
            order: 0 
        });

        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false, 
                animation: false, 
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: {
                    x: { type: 'linear', display: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { display: true, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                elements: { line: { tension: 0 } }
            }
        });
    }

    // Initial load
    updateStrategyInfo();
    runSimulation();
</script>

</body>
</html>
