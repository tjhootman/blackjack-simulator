<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Variance Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;       /* Deep Navy/Black */
            --card-bg: #1e293b;        /* Lighter Navy */
            --primary: #10b981;        /* Casino Green */
            --danger: #ef4444;         /* Ruin Red */
            --text-main: #f8fafc;      /* White */
            --text-muted: #94a3b8;     /* Gray */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: -1px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, select {
            background: #1e293b;
            color: white;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            grid-column: 1 / -1;
            padding: 16px;
            background: linear-gradient(to right, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        button:active { transform: translateY(0); }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-box { text-align: center; }
        
        .stat-val { 
            font-size: 1.8rem; 
            font-weight: 800; 
            display: block; 
            margin-bottom: 5px;
        }
        
        .stat-label { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            font-weight: 600; 
        }

        .chart-container {
            position: relative;
            height: 500px;
            width: 100%;
            background: #0f172a;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Casino Variance Visualizer</h1>

    <div class="controls">
        <div class="control-group">
            <label>Start Bankroll ($)</label>
            <input type="number" id="bankroll" value="2000">
        </div>
        <div class="control-group">
            <label>Bet Size ($)</label>
            <input type="number" id="betSize" value="25">
        </div>
        <div class="control-group">
            <label>Hands to Play</label>
            <input type="number" id="hands" value="1000">
        </div>
        <div class="control-group">
            <label>Simulations (Max 100)</label>
            <input type="number" id="sims" value="50" max="100">
        </div>
        <div class="control-group">
            <label>Rules (Payout)</label>
            <select id="rules">
                <option value="standard">3:2 (Standard)</option>
                <option value="bad">6:5 (Carnival/Bad)</option>
            </select>
        </div>
        <button onclick="runSimulation()">Run Simulation</button>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-val" id="stat-ror">0%</span>
            <span class="stat-label">Risk of Ruin</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-avg">$0</span>
            <span class="stat-label">Avg Ending Bankroll</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-survived">0/0</span>
            <span class="stat-label">Survivors</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<script>
    // Set Global Chart Defaults for Dark Mode
    Chart.defaults.color = '#94a3b8'; // Light gray text for all labels
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)'; // Faint grid lines

    let myChart = null;

    function playHandPro(currentBankroll, betSize, is6to5) {
        const bjPayout = is6to5 ? 1.2 : 1.5;
        const outcomes = [
            { type: 'BJ',       weight: 0.048, val: bjPayout },
            { type: 'Win',      weight: 0.358, val: 1.0 },
            { type: 'DblWin',   weight: 0.040, val: 2.0 },
            { type: 'Push',     weight: 0.085, val: 0.0 },
            { type: 'Loss',     weight: 0.427, val: -1.0 },
            { type: 'DblLoss',  weight: 0.042, val: -2.0 }
        ];

        const rand = Math.random();
        let cumulative = 0;

        for (let outcome of outcomes) {
            cumulative += outcome.weight;
            if (rand < cumulative) {
                return currentBankroll + (betSize * outcome.val);
            }
        }
        return currentBankroll - betSize; 
    }

    function runSimulation() {
        const startBankroll = parseFloat(document.getElementById('bankroll').value);
        const betSize = parseFloat(document.getElementById('betSize').value);
        const totalHands = parseInt(document.getElementById('hands').value);
        const simCount = parseInt(document.getElementById('sims').value);
        const is6to5 = document.getElementById('rules').value === 'bad';

        const allDatasets = [];
        let ruinedCount = 0;
        let finalBankrollSum = 0;
        const labels = Array.from({length: totalHands + 1}, (_, i) => i);

        for (let i = 0; i < simCount; i++) {
            let bankroll = startBankroll;
            const dataPoints = [bankroll];
            let isRuined = false;

            for (let h = 0; h < totalHands; h++) {
                if (bankroll < betSize) {
                    bankroll = 0;
                    isRuined = true;
                } else {
                    bankroll = playHandPro(bankroll, betSize, is6to5);
                }
                dataPoints.push(bankroll);
            }

            finalBankrollSum += bankroll;
            if (isRuined) ruinedCount++;

            // DARK MODE COLORS
            let color = 'rgba(255, 255, 255, 0.15)'; // Default is now faint white
            if (isRuined) color = 'rgba(239, 68, 68, 0.7)'; // Bright Red
            else if (bankroll > startBankroll) color = 'rgba(16, 185, 129, 0.5)'; // Bright Green

            allDatasets.push({
                label: `Sim ${i+1}`,
                data: dataPoints,
                borderColor: color,
                borderWidth: 1.5, // Slightly thicker lines for visibility
                pointRadius: 0, 
                fill: false,
                tension: 0.1 
            });
        }

        const ror = ((ruinedCount / simCount) * 100).toFixed(1);
        const avg = (finalBankrollSum / simCount).toFixed(2);
        
        const rorEl = document.getElementById('stat-ror');
        rorEl.innerText = `${ror}%`;
        // Use exact CSS variable colors for text logic
        rorEl.style.color = ror > 20 ? '#ef4444' : '#10b981'; 
        
        document.getElementById('stat-avg').innerText = `$${avg}`;
        document.getElementById('stat-survived').innerText = `${simCount - ruinedCount}/${simCount}`;

        renderChart(labels, allDatasets, startBankroll);
    }

    function renderChart(labels, datasets, startLine) {
        const ctx = document.getElementById('chartCanvas').getContext('2d');

        if (myChart) myChart.destroy();

        // Start Line (Bright Yellow for contrast)
        datasets.push({
            label: 'Start Bankroll',
            data: new Array(labels.length).fill(startLine),
            borderColor: '#fbbf24', // Amber/Yellow
            borderWidth: 2,
            borderDash: [5, 5],
            pointRadius: 0,
            order: 0 
        });

        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false, 
                animation: false, 
                plugins: {
                    legend: { display: false }, 
                    tooltip: { enabled: false } 
                },
                scales: {
                    x: { 
                        display: true, 
                        ticks: { maxTicksLimit: 10 },
                        grid: { color: 'rgba(255,255,255,0.05)' } // Very subtle grid
                    },
                    y: { 
                        display: true,
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                },
                elements: { line: { tension: 0 } }
            }
        });
    }

    runSimulation();
</script>

</body>
</html>
