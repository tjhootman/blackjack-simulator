<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Strategy Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;       /* Deep Navy */
            --card-bg: #1e293b;        /* Lighter Navy */
            --primary: #8b5cf6;        /* Strategy Purple */
            --accent: #10b981;         /* Green */
            --danger: #ef4444;         /* Red */
            --gold: #fbbf24;           /* Gold */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        /* INPUT GRID */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            padding: 25px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .control-group { display: flex; flex-direction: column; }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, select {
            background: #1e293b;
            color: white;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        /* Highlight specific inputs */
        #strategy { border-color: var(--primary); color: #c4b5fd; font-weight: 600; }
        #skill { border-color: var(--accent); color: #86efac; font-weight: 600; }

        /* INFO CARDS */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
        }

        .info-card {
            padding: 15px 20px;
            border-radius: 8px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .info-card strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .info-card p {
            margin: 0;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        #strategyInfo { background: rgba(139, 92, 246, 0.1); border: 1px solid var(--primary); }
        #strategyInfo strong { color: #c4b5fd; }

        #skillInfo { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent); }
        #skillInfo strong { color: #86efac; }

        button {
            grid-column: 1 / -1;
            padding: 16px;
            background: linear-gradient(to right, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { opacity: 0.7; cursor: wait; }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-box { text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: 800; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }

        .chart-container {
            position: relative;
            height: 500px;
            width: 100%;
            background: #0f172a;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #334155;
        }

        .legend-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; display: inline-block; }
        .line-dash { width: 25px; height: 0; border-top: 2px dashed #fbbf24; margin-right: 8px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h1>Strategy Simulator</h1>

    <div class="controls">
        <div class="control-group">
            <label>Start Bankroll ($)</label>
            <input type="number" id="bankroll" value="2000" min="5">
        </div>
        <div class="control-group">
            <label>Base Bet ($)</label>
            <input type="number" id="betSize" value="25" min="1">
        </div>
        <div class="control-group">
            <label>Table Limit (Max)</label>
            <input type="number" id="tableMax" value="1000" min="1">
        </div>
        
        <div class="control-group">
            <label>Hands (Max 5000)</label>
            <input type="number" id="hands" value="1000" max="5000">
        </div>
        <div class="control-group">
            <label>Simulations (Max 100)</label>
            <input type="number" id="sims" value="50" max="100">
        </div>
        <div class="control-group">
            <label>Rules</label>
            <select id="rules">
                <option value="standard">3:2 (Standard)</option>
                <option value="bad">6:5 (Carnival)</option>
            </select>
        </div>

        <div class="control-group">
            <label style="color: #a78bfa;">Betting Strategy</label>
            <select id="strategy" onchange="updateStrategyInfo()">
                <option value="flat">Flat Betting (Safe)</option>
                <option value="martingale">Martingale (Risky)</option>
                <option value="paroli">Paroli (Hot Streak)</option>
                <option value="dalembert">D'Alembert (Grinder)</option>
            </select>
        </div>
        
        <div class="control-group">
            <label style="color: #86efac;">Player Skill</label>
            <select id="skill" onchange="updateSkillInfo()">
                <option value="perfect">Perfect (Pro)</option>
                <option value="average">Average (Tourist)</option>
                <option value="poor">Poor (Gut Feel)</option>
            </select>
        </div>

        <button id="runBtn" onclick="handleRun()">Run Simulation</button>
    </div>

    <div class="info-grid">
        <div class="info-card" id="strategyInfo">
            <strong>Strategy</strong>
            <p>...</p>
        </div>
        <div class="info-card" id="skillInfo">
            <strong>Skill Level</strong>
            <p>...</p>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-val" id="stat-ror">0%</span>
            <span class="stat-label">Risk of Ruin</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-avg">$0</span>
            <span class="stat-label">Avg Result</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" id="stat-survived">0/0</span>
            <span class="stat-label">Survivors</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="legend-bar">
        <div class="legend-item">
            <span class="dot" style="background-color: #fbbf24;"></span> Big Winner (2x)
        </div>
        <div class="legend-item">
            <span class="dot" style="background-color: #10b981;"></span> Profitable
        </div>
        <div class="legend-item">
            <span class="dot" style="background-color: rgba(255,255,255,0.2);"></span> Survivor (Loss)
        </div>
        <div class="legend-item">
            <span class="dot" style="background-color: #ef4444;"></span> Ruined ($0)
        </div>
        <div class="legend-item">
            <span class="line-dash"></span> Start Amount
        </div>
    </div>
</div>

<script>
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

    let myChart = null;
    const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    
    // DATA TEXT
    const strategyDescriptions = {
        flat: { title: "Flat Betting (Standard)", text: "Bet the same amount every hand. Minimizes volatility. Best for long playtime." },
        martingale: { title: "Martingale (The 'Widowmaker')", text: "Double after loss. Reset after win. Dangerous! Table Limits will eventually force a crash." },
        paroli: { title: "Paroli (The 'Anti-Martingale')", text: "Double after win (up to 3x). Capitalizes on hot streaks with minimal risk." },
        dalembert: { title: "D'Alembert (The Grinder)", text: "Increase bet by 1 unit after loss. Decrease after win. Balanced and safer than Martingale." }
    };

    const skillDescriptions = {
        perfect: { title: "Perfect Play (Pro)", text: "You follow Basic Strategy charts perfectly. <br><strong>House Edge: ~0.5%</strong>" },
        average: { title: "Average (Tourist)", text: "You play mostly correct but miss some soft doubles/splits. <br><strong>House Edge: ~2.0%</strong>" },
        poor: { title: "Poor (Gut Feel)", text: "You hit on 16 vs 6 or don't split Aces. <br><strong>House Edge: ~4.0%</strong>" }
    };

    // PROBABILITY TABLES
    const PROBABILITY_TABLES = {
        perfect: [
            { type: 'BJ',       weight: 0.048, val: 1.5 },
            { type: 'Win',      weight: 0.358, val: 1.0 },
            { type: 'DblWin',   weight: 0.040, val: 2.0 },
            { type: 'Push',     weight: 0.085, val: 0.0 },
            { type: 'Loss',     weight: 0.427, val: -1.0 },
            { type: 'DblLoss',  weight: 0.042, val: -2.0 }
        ],
        average: [
            { type: 'BJ',       weight: 0.048, val: 1.5 },
            { type: 'Win',      weight: 0.350, val: 1.0 },
            { type: 'DblWin',   weight: 0.035, val: 2.0 },
            { type: 'Push',     weight: 0.085, val: 0.0 },
            { type: 'Loss',     weight: 0.435, val: -1.0 },
            { type: 'DblLoss',  weight: 0.047, val: -2.0 }
        ],
        poor: [
            { type: 'BJ',       weight: 0.048, val: 1.5 },
            { type: 'Win',      weight: 0.340, val: 1.0 },
            { type: 'DblWin',   weight: 0.030, val: 2.0 },
            { type: 'Push',     weight: 0.085, val: 0.0 },
            { type: 'Loss',     weight: 0.444, val: -1.0 },
            { type: 'DblLoss',  weight: 0.053, val: -2.0 }
        ]
    };

    function updateStrategyInfo() {
        const val = document.getElementById('strategy').value;
        const info = strategyDescriptions[val];
        const box = document.getElementById('strategyInfo');
        box.innerHTML = `<strong>${info.title}</strong><p>${info.text}</p>`;
        box.style.borderColor = '#c4b5fd';
        setTimeout(() => box.style.borderColor = '#8b5cf6', 300);
    }

    function updateSkillInfo() {
        const val = document.getElementById('skill').value;
        const info = skillDescriptions[val];
        const box = document.getElementById('skillInfo');
        box.innerHTML = `<strong>${info.title}</strong><p>${info.text}</p>`;
        box.style.borderColor = '#86efac';
        setTimeout(() => box.style.borderColor = '#10b981', 300);
    }

    function handleRun() {
        const btn = document.getElementById('runBtn');
        btn.innerHTML = "Simulating...";
        btn.disabled = true;
        setTimeout(() => {
            runSimulation();
            btn.innerHTML = "Run Simulation";
            btn.disabled = false;
        }, 50);
    }

    function playHandOptimized(currentBankroll, betSize, is6to5, skillKey) {
        const outcomes = PROBABILITY_TABLES[skillKey];
        const bjPayout = is6to5 ? 1.2 : 1.5;

        const rand = Math.random();
        let cumulative = 0;
        
        for (let i = 0; i < outcomes.length; i++) {
            cumulative += outcomes[i].weight;
            if (rand < cumulative) {
                let val = outcomes[i].val;
                if (outcomes[i].type === 'BJ') val = bjPayout;
                return currentBankroll + (betSize * val);
            }
        }
        return currentBankroll - betSize; 
    }

    function runSimulation() {
        let startBankroll = parseFloat(document.getElementById('bankroll').value);
        let baseBet = parseFloat(document.getElementById('betSize').value);
        let tableMax = parseFloat(document.getElementById('tableMax').value);
        let totalHands = parseInt(document.getElementById('hands').value);
        let simCount = parseInt(document.getElementById('sims').value);
        const strategy = document.getElementById('strategy').value;
        const is6to5 = document.getElementById('rules').value === 'bad';
        const skillLevel = document.getElementById('skill').value;

        if (simCount > 100) { simCount = 100; document.getElementById('sims').value = 100; }
        if (simCount < 1) simCount = 1;
        if (totalHands > 5000) { totalHands = 5000; document.getElementById('hands').value = 5000; }
        if (totalHands < 10) totalHands = 10;
        if (startBankroll < 5) { startBankroll = 5; document.getElementById('bankroll').value = 5; }
        if (baseBet < 1) { baseBet = 1; document.getElementById('betSize').value = 1; }
        if (baseBet > startBankroll) { baseBet = startBankroll; document.getElementById('betSize').value = startBankroll; }
        if (tableMax < baseBet) { tableMax = baseBet; document.getElementById('tableMax').value = baseBet; }

        const allDatasets = [];
        let ruinedCount = 0;
        let finalBankrollSum = 0;
        const lineWidth = simCount < 10 ? 2.5 : 1;

        for (let i = 0; i < simCount; i++) {
            let bankroll = startBankroll;
            const dataPoints = [{x: 0, y: bankroll}];
            let isRuined = false;

            let currentBet = baseBet;
            let consecutiveWins = 0;
            
            for (let h = 1; h <= totalHands; h++) {
                if (bankroll < 1) { 
                    bankroll = 0;
                    isRuined = true;
                } else {
                    if (currentBet > bankroll) currentBet = bankroll;
                    if (currentBet > tableMax) currentBet = tableMax;

                    let newBankroll = playHandOptimized(bankroll, currentBet, is6to5, skillLevel);
                    let profit = newBankroll - bankroll;
                    
                    if (strategy === 'martingale') {
                        if (profit < 0) currentBet *= 2;
                        else if (profit > 0) currentBet = baseBet;
                    } 
                    else if (strategy === 'paroli') {
                        if (profit > 0) {
                            consecutiveWins++;
                            if (consecutiveWins < 3) currentBet *= 2;
                            else { currentBet = baseBet; consecutiveWins = 0; }
                        } else if (profit < 0) {
                            currentBet = baseBet; consecutiveWins = 0;
                        }
                    } 
                    else if (strategy === 'dalembert') {
                        if (profit < 0) currentBet += baseBet;
                        else if (profit > 0 && currentBet > baseBet) currentBet -= baseBet;
                    }
                    else {
                        currentBet = baseBet;
                    }
                    
                    bankroll = newBankroll;
                }
                dataPoints.push({x: h, y: bankroll});
            }

            finalBankrollSum += bankroll;
            if (isRuined) ruinedCount++;

            let color = 'rgba(255, 255, 255, 0.1)'; 
            let order = 1;

            if (isRuined) { color = 'rgba(239, 68, 68, 0.5)'; order = 2; }
            else if (bankroll > startBankroll * 2) { color = '#fbbf24'; order = 4; }
            else if (bankroll > startBankroll) { color = 'rgba(16, 185, 129, 0.5)'; order = 3; }

            allDatasets.push({
                label: `Sim ${i+1}`,
                data: dataPoints,
                borderColor: color,
                borderWidth: (order === 4) ? lineWidth + 1 : lineWidth, 
                pointRadius: 0, 
                fill: false,
                tension: 0.1,
                order: 100 - order 
            });
        }

        const ror = ((ruinedCount / simCount) * 100).toFixed(1);
        const avgRaw = finalBankrollSum / simCount;
        
        const rorEl = document.getElementById('stat-ror');
        rorEl.innerText = `${ror}%`;
        rorEl.style.color = ror > 20 ? '#ef4444' : '#10b981';
        
        document.getElementById('stat-avg').innerText = USD.format(avgRaw);
        document.getElementById('stat-survived').innerText = `${simCount - ruinedCount}/${simCount}`;

        renderChart(allDatasets, startBankroll, totalHands);
    }

    function renderChart(datasets, startLine, maxX) {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        if (myChart) myChart.destroy();

        datasets.push({
            label: 'Start Bankroll',
            data: [{x: 0, y: startLine}, {x: maxX, y: startLine}],
            borderColor: '#fbbf24',
            borderWidth: 2,
            borderDash: [5, 5],
            pointRadius: 0,
            order: 0 
        });

        myChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false, 
                animation: false, 
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: {
                    x: { type: 'linear', display: true, grid: { color: 'rgba(255,255,255,0.05)' }, max: maxX },
                    y: { display: true, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                elements: { line: { tension: 0 } }
            }
        });
    }

    updateStrategyInfo();
    updateSkillInfo();
    runSimulation();
</script>

</body>
</html>
